{% extends 'bodega/base.html' %}

{% block title %}{{ titulo }} - Music Pro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">{{ titulo }}</h4>
            </div>
            <div class="card-body">
                
                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">SKU:</label>
                        <input type="text" name="sku" value="{% if producto %}{{ producto.sku }}{% endif %}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre del Producto:</label>
                        <input type="text" name="nombre" value="{% if producto %}{{ producto.nombre }}{% endif %}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría:</label>
                        <select name="categoria" class="form-select">
                            <option value="">-- Seleccione Categoría --</option>
                            {% for cat in categorias %}
                            <option value="{{ cat.id }}" {% if producto and producto.categoria_id == cat.id %}selected{% endif %}>
                                {{ cat.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio ($):</label>
                        <input type="number" step="any" name="precio" value="{% if producto %}{{ producto.precio }}{% endif %}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Stock Actual:</label>
                        <input type="number" name="stock_actual" value="{% if producto %}{{ producto.stock_actual }}{% else %}0{% endif %}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Stock Mínimo:</label>
                        <input type="number" name="stock_minimo" value="{% if producto %}{{ producto.stock_minimo }}{% else %}5{% endif %}" class="form-control" required>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'inventario' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
